bundle:
  name: food-sales-predictor

sync:
  include:
    - data-pipeline/**
    - ml-model/**

targets:
  default:
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

variables:
  DATABRICKS_CLUSTER_ID:
    description: "The cluster ID to run tasks on"
    default: "0630-020742-js27j99e"

  OTEL_EXPORTER_OTLP_ENDPOINT:
    description: "OpenTelemetry OTLP endpoint for New Relic"
    default: "https://otlp.nr-data.net:4318"

  OTEL_EXPORTER_OTLP_HEADERS:
    description: "OpenTelemetry OTLP headers (e.g. api-key=<NEW_RELIC_LICENSE_KEY>)"
    default: ""

resources:
  jobs:
    data-cleaning_job:
      name: "Data Cleaning"
      tasks:
        # Task 1: Data Cleaning + Feature Transformation
        - task_key: clean
          spark_python_task:
            python_file: "data-pipeline/Feature_transformation/DataCleaning.py"
            parameters:
              - "--config"
              - "/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}/files/data-pipeline/config/config.yaml"
          existing_cluster_id: "${var.DATABRICKS_CLUSTER_ID}"
          libraries:
            - pypi:
                package: "PyYAML==6.0.1"
            - pypi:
                package: "opentelemetry-api"
            - pypi:
                package: "opentelemetry-sdk"
            - pypi:
                package: "opentelemetry-exporter-otlp-proto-http"

        # Task 2: Load and split TFT training data
        - task_key: load_tft_dataset
          depends_on:
            - task_key: clean
          spark_python_task:
            python_file: "ml-model/training/TFT_Dataset.py"
          existing_cluster_id: "${var.DATABRICKS_CLUSTER_ID}"
          libraries:
            - pypi:
                package: "PyYAML==6.0.1"
            - pypi:
                package: "opentelemetry-api"
            - pypi:
                package: "opentelemetry-sdk"
            - pypi:
                package: "opentelemetry-exporter-otlp-proto-http"